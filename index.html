<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotton America – Wholesale Order</title>
<meta name="theme-color" content="#14322B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="top">
    <div class="logo">Cotton America<small>Wholesale perfume order</small></div>
    <div class="updated" id="updated"></div>
  </div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search perfume name or size" autocomplete="off" aria-label="Search products">
  </div>
</header>

<nav class="filters" aria-label="Filter products">
  <button class="chip" data-g="all" aria-pressed="true">All</button>
  <button class="chip" data-g="M" aria-pressed="false">Men</button>
  <button class="chip" data-g="W" aria-pressed="false">Women</button>
  <button class="chip" data-g="U" aria-pressed="false">Unisex</button>
  <button class="chip" id="instock" aria-pressed="false">In stock only</button>
</nav>
<div class="count" id="count"></div>

<main>
  <div class="list" id="list"><div class="loading">Loading products…</div></div>
</main>

<div class="orderbar" id="orderbar">
  <button id="openCart" aria-label="Review order">
    <span class="qty" id="barQty">0</span>
    <span class="label">Review order</span>
    <span class="total" id="barTotal"></span>
  </button>
</div>

<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </section>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
